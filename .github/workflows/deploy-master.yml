# Deploy do submodule api-platform-common → ambiente master
# Preferencial: deploy via parent api-community (atualiza todos os submodules).
# Este workflow existe para hotfixes só neste módulo.
# Secrets devem estar configurados NESTE repositório (ou org secrets com acesso).
name: Deploy Master (Production)
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy common → master
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.CONTROLEONLINE }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            MODULE="~/sistemas/controleonline/api/modules/controleonline/common"
            cd "$MODULE"
            git fetch origin
            if git show-ref --verify --quiet refs/heads/master; then
              git checkout master
            else
              git checkout -B master origin/master
            fi
            git reset --hard origin/master
            git clean -ffd
            cd "$(git rev-parse --show-toplevel 2>/dev/null || echo /var/www/api-community)"
            if [ -f bin/console ]; then
              php bin/console cache:clear --no-interaction || true
            fi
            echo "api-platform-common deployed: $(cd $MODULE && git rev-parse --short HEAD) (master)"
